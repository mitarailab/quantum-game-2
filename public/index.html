<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>favicon.svg" />
    <link rel="canonical" href="<%= VUE_APP_MAIN_URL %>/" />
    <title><%= VUE_APP_TITLE %></title>
    <meta name="description" content="<%= VUE_APP_DESCRIPTION %>" />
    <meta name="author" content="<%= VUE_APP_AUTHORS %>" />
    <!-- Twitter stuff -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="<%= VUE_APP_MAIN_URL %>" />
    <meta name="twitter:title" content="<%= VUE_APP_TITLE %>" />
    <meta name="twitter:description" content="<%= VUE_APP_DESCRIPTION %>" />
    <!-- Facebook stuff -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="<%= VUE_APP_TITLE %>" />
    <meta property="og:description" content="<%= VUE_APP_DESCRIPTION %>" />
    <meta property="og:url" content="<%= VUE_APP_MAIN_URL %>" />
  </head>

  <body>
    <noscript>
      <strong>このゲームを遊ぶにはJavaScriptを有効にしてください。</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
